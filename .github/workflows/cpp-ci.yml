name: C++ CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSYS2 UCRT64
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make

      - name: Add UCRT64 tools to PATH
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_PATH -Value "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"

      - name: Configure with CMake
        shell: cmd
        run: cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build application and tests
        shell: cmd
        run: cmake --build build --target StudentApp StudentTests --parallel

      - name: Run tests
        shell: cmd
        run: ctest --test-dir build --output-on-failure

      - name: Verify StudentApp executable
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'build/StudentApp.exe' -PathType Leaf)) {
            throw 'Expected build/StudentApp.exe was not produced.'
          }

      - name: Upload Student Application artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: StudentManagementSystem-Windows
          path: build/StudentApp.exe
          if-no-files-found: error
          retention-days: 7
